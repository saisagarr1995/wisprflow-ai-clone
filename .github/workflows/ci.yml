name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The desktop app targets Windows today (hotkey, injection, and context
  # backends are Win32). CI validates the full workspace on Windows. macOS/Linux
  # jobs will return alongside those platform backends — until then, cross-
  # platform CI only fought environmental linker issues in deps we don't ship
  # on those platforms yet (e.g. the ONNX runtime), so it's intentionally omitted.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install LLVM + CMake (whisper.cpp needs libclang + cmake)
        run: choco install llvm cmake -y
      - name: Expose libclang to bindgen
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The desktop crate's generate_context! requires the UI dist dir to exist.
      - name: Build UI
        run: |
          npm ci
          npm run build
        working-directory: apps/desktop
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
