name: Build Windows App

# Builds the OpenFlow desktop app on GitHub's runners (16 GB RAM) and uploads
# the installer + standalone exe as downloadable artifacts — so you never have
# to compile locally. Runs on every push to main, or on demand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # publish installers to GitHub Releases on v* tags

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # ggml's Vulkan shader generator nests CMake ExternalProject dirs deep
      # enough to blow past MAX_PATH under target\release\build\… — build
      # into a short root instead (error C1083 "Cannot open compiler
      # generated file: ''" otherwise).
      CARGO_TARGET_DIR: C:\ct
      # Portable CPU baseline (see the file for why): without it the binary
      # inherits the runner CPU's instruction set and can crash user
      # machines with 0xc000001d. CMake ≥3.21 reads this env var directly.
      # The same file pins clang-cl as the ggml compiler — the runner's
      # preview MSVC emits whisper kernels that decode 5-20x slower (this
      # shipped in v0.1.0 as 30 s dictations on user machines).
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}\ci\ggml-cpu-baseline.cmake
      # Ninja instead of the Visual Studio generator: no VS toolset
      # selection at all, so the runner's VS version can't leak into the
      # build. cmake-rs honors this env var.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM + CMake + Ninja (whisper.cpp toolchain)
        run: choco install llvm cmake ninja -y
      - name: Expose libclang + cmake
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # Build-time only: gives the app GPU-accelerated STT (whisper.cpp
      # Vulkan backend — works on AMD/Intel/NVIDIA alike). End users need
      # nothing extra; the app falls back to CPU when no GPU is usable.
      - name: Install Vulkan SDK (for gpu-vulkan feature)
        shell: pwsh
        run: |
          $ver = "1.4.313.2"
          curl.exe -L -o "$env:RUNNER_TEMP\vulkan_sdk.exe" "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          Start-Process "$env:RUNNER_TEMP\vulkan_sdk.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          "VULKAN_SDK=C:\VulkanSDK\$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\VulkanSDK\$ver\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2

      - name: Install UI deps
        run: npm ci
        working-directory: apps/desktop

      # Produces the NSIS installer (.exe) + the standalone binary. Pin to
      # Windows bundles so the Mac/Linux targets in tauri.conf.json don't error.
      - name: Build installer (tauri build)
        run: npm run tauri build -- --bundles nsis --features gpu-vulkan
        working-directory: apps/desktop

      # Build output lands under CARGO_TARGET_DIR (short path, see env above).
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlow-Windows-Installer
          path: C:\ct\release\bundle\nsis\*.exe
          if-no-files-found: error

      - name: Upload standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlow-Windows-Standalone
          path: C:\ct\release\openflow-desktop.exe
          if-no-files-found: error

      # Tag a commit `vX.Y.Z` and the installer lands on the public Releases
      # page — the download anyone can use without a GitHub account
      # (README "Installation — Option A").
      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem C:\ct\release\bundle\nsis\*.exe).FullName
          gh release create "${{ github.ref_name }}" $exe --title "OpenFlow ${{ github.ref_name }}" --generate-notes
