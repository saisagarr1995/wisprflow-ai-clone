name: Build Windows App

# Builds the OpenFlow desktop app on GitHub's runners (16 GB RAM) and uploads
# the installer + standalone exe as downloadable artifacts — so you never have
# to compile locally. Runs on every push to main, or on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM + CMake (whisper.cpp needs libclang + cmake)
        run: choco install llvm cmake -y
      - name: Expose libclang + cmake
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # Build-time only: gives the app GPU-accelerated STT (whisper.cpp
      # Vulkan backend — works on AMD/Intel/NVIDIA alike). End users need
      # nothing extra; the app falls back to CPU when no GPU is usable.
      - name: Install Vulkan SDK (for gpu-vulkan feature)
        shell: pwsh
        run: |
          $ver = "1.4.313.2"
          curl.exe -L -o "$env:RUNNER_TEMP\vulkan_sdk.exe" "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          Start-Process "$env:RUNNER_TEMP\vulkan_sdk.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          "VULKAN_SDK=C:\VulkanSDK\$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\VulkanSDK\$ver\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2

      - name: Install UI deps
        run: npm ci
        working-directory: apps/desktop

      # Produces the NSIS installer (.exe) + the standalone binary. Pin to
      # Windows bundles so the Mac/Linux targets in tauri.conf.json don't error.
      - name: Build installer (tauri build)
        run: npm run tauri build -- --bundles nsis --features gpu-vulkan
        working-directory: apps/desktop

      # This is a Cargo workspace, so build output lands in the workspace-root
      # target/, not the crate's own directory.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlow-Windows-Installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlow-Windows-Standalone
          path: target/release/openflow-desktop.exe
          if-no-files-found: error
